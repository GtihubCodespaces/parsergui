plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.parsergui.studio'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'ai.parsergui.studio'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DPARSERGUI_ANDROID=ON',
                          '-DPARSERGUI_BUILD_GUI=OFF',
                          '-DPARSERGUI_BUILD_TESTS=OFF',
                          '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
