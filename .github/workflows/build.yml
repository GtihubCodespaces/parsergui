name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2022
            arch: x64
          - name: windows-x86
            os: windows-2022
            arch: Win32
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cmake --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A "${TARGET_ARCH:-x64}" \
              -DPARSERGUI_BUILD_GUI=ON -DPARSERGUI_BUILD_TESTS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DPARSERGUI_BUILD_GUI=ON -DPARSERGUI_BUILD_TESTS=ON
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 3 2>&1 | tee build-output.log

      # Compiler diagnostics live in the step log; surface the first few as
      # annotations so a failure is diagnosable from the run page itself.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -iE "error [A-Z]+[0-9]+|error:|fatal error|CMake Error" build-output.log | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix dist

      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/bin/parsergui
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" version
          rm -rf smoke-out
          "$BIN" parse assets/demo/complex/source.png --out smoke-out --auto-gui
          test -f smoke-out/report.json
          test -f smoke-out/parsed_ui.cpp
          grep -q "elements" smoke-out/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: parsergui-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  android:
    name: android-arm64-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # setup-android@v3 broke under the Node 20 -> 24 runner migration, so the
      # SDK that ships with the Ubuntu image is used directly. That is the same
      # SDK the action would have downloaded, minus a fragile dependency.
      - name: Install SDK, NDK and CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "sdk: $SDK"
          ls "$SDK"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gradle version
        run: gradle --version

      - name: Build APK
        working-directory: android
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          # Gradle downloads plugins and the NDK toolchain on a cold runner; a
          # transient network failure should not fail the whole matrix.
          for attempt in 1 2; do
            if gradle assembleDebug --no-daemon --stacktrace --max-workers=2 2>&1 | tee gradle.log; then
              exit 0
            fi
            if [ "$attempt" = "1" ]; then
              echo "::warning::Gradle failed on attempt 1, retrying once"
              sleep 10
            fi
          done
          grep -E "^e: |error:|FAILURE:|What went wrong|Caused by" gradle.log | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/libpgr_core\.so"

      - uses: actions/upload-artifact@v4
        with:
          name: parsergui-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
