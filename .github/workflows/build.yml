name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            generator: Unix Makefiles
            arch: ""
          - name: windows-x64
            os: windows-2022
            generator: Visual Studio 17 2022
            arch: x64
          - name: windows-x86
            os: windows-2022
            generator: Visual Studio 17 2022
            arch: Win32
          - name: macos-arm64
            os: macos-15
            generator: Unix Makefiles
            arch: ""
          - name: macos-x64
            os: macos-15-intel
            generator: Unix Makefiles
            arch: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build -G "${{ matrix.generator }}" -A "${{ matrix.arch }}" \
              -DPARSERGUI_BUILD_GUI=ON -DPARSERGUI_BUILD_TESTS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DPARSERGUI_BUILD_GUI=ON -DPARSERGUI_BUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix dist

      - name: Smoke test CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/bin/parsergui.exe version
          else
            ./dist/bin/parsergui version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: parsergui-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  android:
    name: android-arm64-x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check native library
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/(arm64-v8a|x86_64)/libpgr_core.so"

      - uses: actions/upload-artifact@v4
        with:
          name: parsergui-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
